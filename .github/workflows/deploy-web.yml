name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # .env is a declared asset and is git-ignored, so build it from repository variables.
      # Firebase web config values are public identifiers, so variables (not secrets) are fine.
      - name: Create .env
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_AUTH_DOMAIN: ${{ vars.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_WEB_MEASUREMENT_ID: ${{ vars.FIREBASE_WEB_MEASUREMENT_ID }}
        run: |
          {
            echo "API_BASE_URL=$API_BASE_URL"
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            echo "FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
            echo "FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET"
            echo "FIREBASE_WEB_API_KEY=$FIREBASE_WEB_API_KEY"
            echo "FIREBASE_WEB_APP_ID=$FIREBASE_WEB_APP_ID"
            echo "FIREBASE_WEB_AUTH_DOMAIN=$FIREBASE_WEB_AUTH_DOMAIN"
            echo "FIREBASE_WEB_MEASUREMENT_ID=$FIREBASE_WEB_MEASUREMENT_ID"
          } > .env

      - run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages serves 404.html for unknown paths; reuse the app shell so deep links work.
      - name: SPA fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
