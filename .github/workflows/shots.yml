name: Capture screenshots
on: workflow_dispatch
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm init -y >/dev/null && npm i playwright@1.49.1 --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Capture
        run: |
          cat > shot.js <<'JS'
          const { chromium } = require('playwright');
          const URL = 'https://hikki-dev.github.io/Watch-final/';
          const MODES = [
            ['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist'],
            ['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist'],
            ['--enable-webgl','--ignore-gpu-blocklist','--disable-gpu-sandbox','--use-angle=swiftshader-webgl'],
          ];
          async function shoot(name, w, h, scale) {
            for (const args of MODES) {
              const b = await chromium.launch({ args });
              const p = await b.newPage({ viewport: { width: w, height: h }, deviceScaleFactor: scale, locale: 'en-US', timezoneId: 'Asia/Dubai' });
              p.on('console', m => console.log('console:', m.type(), m.text().slice(0, 160)));
              p.on('pageerror', e => console.log('pageerror:', String(e).slice(0, 200)));
              p.on('requestfailed', r => console.log('reqfailed:', r.url().slice(0, 120), r.failure()?.errorText));
              await p.goto(URL, { waitUntil: 'load' });
              const gl = await p.evaluate(() => !!document.createElement('canvas').getContext('webgl2'));
              console.log('mode', args[0], args[1], 'webgl2:', gl);
              let size = 0;
              for (let i = 0; i < 10; i++) {
                await p.waitForTimeout(3000);
                const buf = await p.screenshot({ path: name });
                size = buf.length;
                const ok = await p.evaluate(() => !!document.querySelector('flt-glass-pane, canvas'));
                if (size > 40000) break;
              }
              console.log(name, size);
              await b.close();
              if (size > 40000) return;
            }
          }
          (async () => { await shoot('signin-desktop.png', 1440, 900, 2); await shoot('signin-phone.png', 390, 844, 3); })();
          JS
          node shot.js
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: '*.png' }
