name: Capture screenshots
on: workflow_dispatch
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm init -y >/dev/null && npm i playwright@1.49.1 --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Capture with the browser's default locale (the setting that used to crash the app)
        run: |
          cat > shot.js <<'JS'
          const { chromium } = require('playwright');
          const URL = 'https://hikki-dev.github.io/Watch-final/';
          async function shoot(name, w, h, scale) {
            const b = await chromium.launch({ args: ['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist'] });
            const p = await b.newPage({ viewport: { width: w, height: h }, deviceScaleFactor: scale, locale: 'en-US', timezoneId: 'Asia/Dubai' });
            p.on('pageerror', e => console.log('pageerror:', String(e).slice(0, 200)));
            await p.goto(URL, { waitUntil: 'load' });
            console.log('navigator.language =', JSON.stringify(await p.evaluate(() => navigator.language)));
            let size = 0;
            for (let i = 0; i < 10; i++) { await p.waitForTimeout(3000); size = (await p.screenshot({ path: name })).length; if (size > 40000) break; }
            console.log(name, size);
            await b.close();
          }
          (async () => { await shoot('signin-desktop.png', 1440, 900, 2); await shoot('signin-phone.png', 390, 844, 3); })();
          JS
          node shot.js
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: '*.png' }
