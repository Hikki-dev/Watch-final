<title id="t">How the app fits together</title><desc id="d">The Flutter app signs you in with Firebase, swaps that for a token from the Laravel-Watch API, and then asks the API for products, carts and profiles. A small local cache keeps the last catalogue for when the network is slow. The app also reads the camera, location and battery of the phone.</desc><defs>
