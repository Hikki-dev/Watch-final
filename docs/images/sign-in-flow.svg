<line x1="1016" y1="230" x2="1032" y2="230" stroke="#64748b" stroke-width="2.4" marker-end="url(#a64748b)"/>
<line x1="1266" y1="230" x2="1282" y2="230" stroke="#64748b" stroke-width="2.4" marker-end="url(#a64748b)"/>
<rect x="40" y="180" width="220" height="100" rx="16" fill="#ffffff" stroke="#ffa000" stroke-width="2.4"/>
<rect x="40" y="180" width="9" height="100" rx="4" fill="#ffa000"/>
<text x="154" y="226" class="t">Sign in</text>
<text x="154" y="252" class="s">Firebase: email or Google</text>
<rect x="290" y="180" width="220" height="100" rx="16" fill="#ffffff" stroke="#ff2d20" stroke-width="2.4"/>
<rect x="290" y="180" width="9" height="100" rx="4" fill="#ff2d20"/>
<text x="404" y="226" class="t">Swap</text>
<text x="404" y="252" class="s">API turns it into a token</text>
<rect x="540" y="180" width="220" height="100" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2.4"/>
<rect x="540" y="180" width="9" height="100" rx="4" fill="#0f766e"/>
<text x="654" y="226" class="t">Save</text>
<text x="654" y="252" class="s">token kept on the device</text>
<rect x="790" y="180" width="220" height="100" rx="16" fill="#ffffff" stroke="#02569b" stroke-width="2.4"/>
<rect x="790" y="180" width="9" height="100" rx="4" fill="#02569b"/>
<text x="904" y="226" class="t">Ask</text>
<text x="904" y="252" class="s">every call sends the token</text>
<rect x="1040" y="180" width="220" height="100" rx="16" fill="#ffffff" stroke="#7c5cc4" stroke-width="2.4"/>
<rect x="1040" y="180" width="9" height="100" rx="4" fill="#7c5cc4"/>
<text x="1154" y="226" class="t">Role</text>
