<title id="t">From sign-in to the right screen</title><desc id="d">After Firebase signs you in, the app sends the sign-in to the Laravel API and gets back a token. It saves the token, sends it with every request, reads your role from the API and opens the customer, seller or admin screen.</desc><defs>
